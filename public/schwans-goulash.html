<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14100E" />
    <title>Schwan's-Style Goulash — The Recipe Hub</title>
    <style>
      :root {
        --bg: #14100e;
        --panel: #1f1917;
        --line: #3d322e;
        --cream: #f2eae2;
        --dim: #a99c93;
        --red: #c8452f;
        --gold: #5B8CA9;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--cream);
        font-family: -apple-system, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      main {
        max-width: 440px;
        text-align: center;
        background: var(--panel);
        border: 1px solid var(--line);
        border-top: 3px solid var(--gold);
        border-radius: 10px;
        padding: 32px 28px;
      }
      .icon {
        width: 44px;
        height: 44px;
        margin: 0 auto 16px;
        border-radius: 8px;
        background: var(--gold);
        color: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 18px;
      }
      h1 { font-size: 19px; margin: 0 0 8px; }
      p { color: var(--dim); line-height: 1.6; font-size: 14px; margin: 0 0 20px; }
      .note {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--red);
        margin-bottom: 20px;
      }
      a { color: var(--gold); text-decoration: none; font-size: 13px; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">G</div>
      <div class="note">Guide pending</div>
      <h1>Schwan's-Style Goulash</h1>
      <p>Copycat build with Aldi/Costco cost split and scaling. This standalone guide hasn't been added to the repo yet — drop the real schwans-goulash.html into /public and it replaces this placeholder, no code changes needed.</p>
      <a href="./index.html">← Back to the Recipe Hub</a>
    </main>
  </body>
</html>
